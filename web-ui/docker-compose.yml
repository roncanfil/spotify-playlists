# Playlist Downloader — the deployment file.
#
# Works three ways, unchanged:
#
#   CasaOS / ZimaOS      App Store -> Custom Install -> Import, paste this file
#   Portainer / Dockge   Stacks -> Add stack -> Web editor, paste this file
#   Any Linux box        curl it down, edit, `docker compose up -d`
#
# It pulls a prebuilt public image, so there is no build step and no login.
# Deliberately uses no ${VARIABLE} substitution and needs no .env file: the
# paste-into-a-textarea installers above cannot supply one.
#
# Four things you may want to change, marked EDIT below. Everything else works
# as-is.
#
# Building from source instead (contributors): see web-ui/README.md.

name: playlist-downloader

services:
  downloader:
    image: ghcr.io/roncanfil/spotify-playlists-to-mp3:latest
    container_name: playlist-downloader
    restart: unless-stopped
    ports:
      # EDIT 1 (optional) — host port. Change the LEFT number only; the
      # container always listens on 8765 internally. If you change it, change
      # the port in SPOTIFY_REDIRECT_URI below to match.
      - "8765:8765"
    environment:
      # EDIT 2 (optional) — set a password to require a login. Any username
      # works; only the password is checked. Leave empty for no login. Set it
      # if this box is reachable from outside your LAN.
      APP_PASSWORD: ""

      # EDIT 3 (optional) — Spotify. Blank hides the Playlists tab and the app
      # works by CSV upload alone. To enable it, create a free app at
      # https://developer.spotify.com/dashboard, tick "Web API", register the
      # redirect URI below EXACTLY, and paste the Client ID here.
      # No client secret is needed (Authorization Code + PKCE).
      SPOTIFY_CLIENT_ID: ""

      # Spotify's rule: the redirect must be HTTPS, with one exception -- a
      # loopback address may use plain HTTP. `localhost` is rejected outright.
      # So there are two valid setups:
      #
      #  1. No domain (the default below). Only 127.0.0.1 works, which means
      #     the one-time "Connect" click must come from a browser that reaches
      #     the app as 127.0.0.1. Over SSH:
      #       ssh -L 8765:127.0.0.1:8765 you@server
      #     then open http://127.0.0.1:8765 locally and click Connect.
      #     Keep the port here equal to the host port in EDIT 1.
      #
      #  2. A real domain behind HTTPS (recommended once you have one). Put
      #     the app behind a reverse proxy with a TLS certificate and set:
      #       SPOTIFY_REDIRECT_URI: "https://music.example.com/callback"
      #     No tunnel, and anyone can connect from any browser. A plain
      #     http:// domain will NOT work -- Spotify requires TLS here.
      #
      # Either way, register the exact value in the Spotify dashboard.
      SPOTIFY_REDIRECT_URI: "http://127.0.0.1:8765/callback"

      # Reinstalls yt-dlp on every container start. yt-dlp is the piece YouTube
      # keeps breaking, so leaving this at 1 means "restart the app" fixes most
      # future breakage with no new image. Set to 0 to pin the bundled version.
      AUTO_UPDATE_YTDLP: "1"

      # Container-internal paths, matching the volume targets below. No reason
      # to change these.
      MUSIC_DIR: /music
      PLAYLIST_DIR: /playlists
      STATE_DIR: /data
      YTDLP_UPGRADE_DIR: /data/ytdlp
      BGUTIL_POT_BASE_URL: http://bgutil-provider:4416
    volumes:
      # EDIT 4 — host paths, on the LEFT of each colon. Defaults follow the
      # CasaOS layout; on a plain server or Proxmox guest point them anywhere
      # you like (e.g. /srv/playlist-downloader/...). Docker creates them.
      - /DATA/Media/Music:/music
      - /DATA/AppData/playlist-downloader/playlists:/playlists
      - /DATA/AppData/playlist-downloader/state:/data
    depends_on:
      - bgutil-provider

  # Solves YouTube's "confirm you're not a bot" challenge, which a NAS or VPS
  # IP trips far more often than a home laptop does. Upstream publishes this to
  # Docker Hub only -- there is no GHCR copy -- so it comes from there.
  # Supports amd64 and arm64.
  # To drop it: delete this service, the depends_on above, and
  # BGUTIL_POT_BASE_URL. Downloads still work, you just see more bot checks.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    expose:
      - "4416"

# CasaOS / ZimaOS store metadata. Ignored by plain docker compose, Portainer and
# Dockge, so one file stays valid everywhere.
x-casaos:
  id: com.github.roncanfil.playlist-downloader
  main: downloader
  index: /
  port_map: "8765"
  scheme: http
  architectures:
    - amd64
    - arm64
  title:
    en_US: Playlist Downloader
  tagline:
    en_US: Turn Spotify playlists into tagged MP3 or FLAC files.
  description:
    en_US: >-
      A self-hosted web UI that takes a Spotify playlist -- connected directly
      or uploaded as a CSV -- finds each track, and saves it as a properly
      tagged MP3 or FLAC, one folder per playlist. yt-dlp refreshes itself on
      every restart, so the usual YouTube breakage is fixed by restarting the
      app rather than waiting for a new image.
  tips:
    before_install:
      en_US: >-
        Set APP_PASSWORD if this box is reachable from outside your LAN.
        Spotify's login only works through an SSH tunnel to 127.0.0.1 -- see the
        comments in the compose file. You can skip Spotify entirely and upload
        playlist CSVs instead.
  category: Media
  author: roncanfil
  developer: roncanfil
  website: https://github.com/roncanfil/spotify-playlists-to-MP3
  repo: https://github.com/roncanfil/spotify-playlists-to-MP3
  support: https://github.com/roncanfil/spotify-playlists-to-MP3/issues
  icon: https://raw.githubusercontent.com/roncanfil/spotify-playlists-to-MP3/main/web-ui/icon.png
  version: "1.1.0"
