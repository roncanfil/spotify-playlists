# Playlist Downloader — server deployment from a prebuilt image.
#
# Nothing here is built on the server, so this folder is all the server needs:
# this file plus a .env. No source checkout, no Dockerfile, no compiler.
#
#   mkdir -p ~/playlist-downloader && cd ~/playlist-downloader
#   # copy this file and .env.example across, then:
#   cp .env.example .env && nano .env
#   docker compose up -d
#
# To update later:  docker compose pull && docker compose up -d
#
# The image is built and pushed from a dev machine; see deploy/README.md.

name: playlist-downloader

services:
  downloader:
    # Pinning a real version rather than floating on :latest means `pull` is a
    # deliberate act and you can roll back by editing one line.
    image: "${IMAGE:-ghcr.io/roncanfil/spotify-playlists-to-mp3}:${IMAGE_TAG:-latest}"
    container_name: playlist-downloader
    restart: unless-stopped
    ports:
      - "${PORT:-8765}:8765"
    environment:
      MUSIC_DIR: /music
      PLAYLIST_DIR: /playlists
      YTDLP_UPGRADE_DIR: /data/ytdlp
      # Refresh yt-dlp on every container start — this is what fixes most
      # future YouTube breakage without touching the image. Set to 0 to pin
      # whatever the image shipped with.
      AUTO_UPDATE_YTDLP: "${AUTO_UPDATE_YTDLP:-1}"
      BGUTIL_POT_BASE_URL: http://bgutil-provider:4416
      # Leave empty for no login; set a value to require a password.
      APP_PASSWORD: "${APP_PASSWORD:-}"
      STATE_DIR: /data
      # Optional Spotify integration; blank disables the Playlists tab.
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      # Must point at the HOST port, since that is what the browser opens --
      # hence ${PORT}, not the fixed 8765 the container listens on inside.
      SPOTIFY_REDIRECT_URI: "${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:${PORT:-8765}/callback}"
    volumes:
      # Finished music, one subfolder per CSV. Point this at the big disk.
      - "${MUSIC_PATH:?set MUSIC_PATH in .env}:/music"
      # Uploaded and saved CSV playlists.
      - "${PLAYLIST_PATH:?set PLAYLIST_PATH in .env}:/playlists"
      # Persisted yt-dlp upgrades and the Spotify token.
      - "${STATE_PATH:?set STATE_PATH in .env}:/data"
    depends_on:
      - bgutil-provider

  # Clears YouTube's "confirm you're not a bot" checks, which a server IP trips
  # far more often than a home connection does. Public image, pulled directly.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    expose:
      - "4416"
