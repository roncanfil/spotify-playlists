<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist Downloader</title>
<style>
  :root {
    --bg:#f6f6f4; --panel:#fff; --ink:#1a1a19; --muted:#6b6b66;
    --line:#e2e2dd; --accent:#2f6f4f; --accent-ink:#fff; --fail:#a3302a;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#16171a; --panel:#1e2024; --ink:#e9e9e6; --muted:#9a9a94;
      --line:#2e3136; --accent:#4f9d76; --accent-ink:#10231a; --fail:#e0736c;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:24px; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:340px; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); padding:26px 24px; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:-.01em; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:13.5px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input[type=password] { width:100%; padding:10px 11px; font-size:15px;
    color:var(--ink); background:var(--bg); border:1px solid var(--line);
    border-radius:8px; }
  input[type=password]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:14px; padding:10px; font-size:15px;
    font-weight:500; cursor:pointer; color:var(--accent-ink);
    background:var(--accent); border:0; border-radius:8px; }
  .err { margin:14px 0 0; padding:9px 11px; border-radius:8px; font-size:13.5px;
    color:var(--fail); border:1px solid var(--fail); background:transparent; }
</style>

<form class="card" method="post" action="/login">
  <h1>Playlist Downloader</h1>
  <p class="sub">Enter the password to continue.</p>

  <label for="password">Password</label>
  <!-- autofocus so it is ready to type, and the browser can offer a saved one -->
  <input type="password" id="password" name="password" autofocus required
         autocomplete="current-password">

  <button type="submit">Sign in</button>

  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <input type="hidden" name="next" value="{{ next_url }}">
</form>
