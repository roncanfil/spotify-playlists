# Spotify Playlists — https://github.com/roncanfil/spotify-playlists
# Setup and troubleshooting: deploy/README.md

name: spotify-playlists

services:
  spotify-playlists:
    image: ghcr.io/roncanfil/spotify-playlists:latest
    container_name: spotify-playlists
    restart: unless-stopped
    ports:
      # Host port on the left; the container is always 8765.
      - "8765:8765"
    environment:
      # Blank = no login. Set one and the app shows a password page.
      APP_PASSWORD: ""

      # Blank = no Playlists tab; CSV upload still works. PKCE, so no secret.
      SPOTIFY_CLIENT_ID: ""

      # Register verbatim at https://developer.spotify.com/dashboard, port
      # included. Must be https:// for a real domain — Spotify accepts http://
      # only for 127.0.0.1, and rejects `localhost` outright.
      SPOTIFY_REDIRECT_URI: "http://127.0.0.1:8765/callback"

      # Refresh yt-dlp each start; a restart then fixes most YouTube breakage.
      AUTO_UPDATE_YTDLP: "1"

      BGUTIL_POT_BASE_URL: http://bgutil-provider:4416
    volumes:
      # Your library, and the only path to set. One folder per playlist,
      # holding its tracks, its .csv and its .m3u.
      - ./music:/music
    depends_on:
      - bgutil-provider

  # Answers YouTube's bot checks. Optional: drop this service, the depends_on
  # and BGUTIL_POT_BASE_URL.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    expose:
      - "4416"
