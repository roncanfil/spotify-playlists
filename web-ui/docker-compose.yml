# Spotify Playlists — https://github.com/roncanfil/spotify-playlists
# Setup and troubleshooting: deploy/README.md

name: spotify-playlists

services:
  spotify-playlists:
    image: ghcr.io/roncanfil/spotify-playlists:latest
    container_name: spotify-playlists
    restart: unless-stopped
    ports:
      # Host port on the left; the container is always 8765.
      - "8765:8765"
    environment:
      # Blank = no login. Set one and the app shows a password page.
      APP_PASSWORD: ""

      # Blank = no Playlists tab; CSV upload still works. PKCE, so no secret.
      SPOTIFY_CLIENT_ID: ""

      # Register verbatim at https://developer.spotify.com/dashboard, port
      # included. Must be https:// for a real domain — Spotify accepts http://
      # only for 127.0.0.1, and rejects `localhost` outright.
      SPOTIFY_REDIRECT_URI: "http://127.0.0.1:8765/callback"

      # Refresh yt-dlp each start; a restart then fixes most YouTube breakage.
      AUTO_UPDATE_YTDLP: "1"

      # Seconds between checks of playlists kept in sync; 0 turns them off.
      # SYNC_INTERVAL: "3600"

      BGUTIL_POT_BASE_URL: http://bgutil-provider:4416
    volumes:
      # Your library, and the only path to set. One folder per playlist,
      # album or artist. Set the same path on slskd below.
      - ./music:/music
    depends_on:
      - bgutil-provider
    networks:
      - spotify-playlists

  # Answers YouTube's bot checks. Optional: drop this service, the depends_on
  # and BGUTIL_POT_BASE_URL.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    expose:
      - "4416"
    networks:
      - spotify-playlists

  # Soulseek, for real 320 kbps and lossless files. Nothing to fill in here:
  # the app's setup screen asks for the account and configures it. Shares your
  # music folder with other Soulseek users, which is what Soulseek runs on.
  # Not using Soulseek? Comment out this whole service to skip the container;
  # the app then uses YouTube only.
  slskd:
    image: slskd/slskd:0.26.2
    container_name: slskd
    restart: unless-stopped
    environment:
      # slskd keeps its settings, database and downloads in a hidden folder in
      # your music library, so the music path stays the only one to set.
      SLSKD_APP_DIR: /music/.spotify-playlists/slskd
    ports:
      # Other Soulseek users connect in on this port. Forward it on your router
      # to this machine: it works without, but far fewer downloads succeed.
      - "50300:50300"
      # Uncomment to reach slskd's own web UI at http://<host>:5030. Its login
      # is slskd / slskd unless you set SLSKD_USERNAME and SLSKD_PASSWORD.
      # - "5030:5030"
    volumes:
      # The same path as the app's music folder, above.
      - ./music:/music
    networks:
      - spotify-playlists

# The app finds slskd and bgutil-provider by name, which only works on a
# network of their own: Docker's default "bridge" network, where CasaOS and
# some other tools put containers, has no names. Keep this, and keep every
# service on it.
networks:
  spotify-playlists:
    name: spotify-playlists
