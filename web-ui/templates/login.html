<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sign in · Spotify Playlists</title>
<style>
  /* The app's Sleeve look: a blue field with the name set huge, a black-ruled card. */
  @font-face { font-family:"Archivo"; font-weight:100 900; font-stretch:62% 125%; font-display:swap;
    src:url("/static/fonts/archivo-latin.woff2") format("woff2"); }
  :root {
    --bg:#ffffff; --surface:#ffffff; --ink:#0b0b0f; --muted:#5a5f78; --faint:#9a9db0; --line-2:#0b0b0f;
    --blue:#1b2bb5; --accent:#1b2bb5; --accent-ring:rgba(27,43,181,.3); --hot:#ff4d1f; --hot-hover:#f03d0f;
    --fail:#c8102e; --fail-soft:rgba(200,16,46,.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0d12; --surface:#14151c; --ink:#f2f2f5; --muted:#9da1b5; --faint:#6b6f85; --line-2:#f2f2f5;
      --blue:#2233c9; --accent:#8b98ff; --accent-ring:rgba(139,152,255,.35); --hot:#ff5a2c; --hot-hover:#ff7247;
      --fail:#ff6b81; --fail-soft:rgba(255,107,129,.12); color-scheme: dark; }
  }
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:grid; grid-template-rows:auto 1fr;
    background:var(--bg); color:var(--ink); font:430 15px/1.5 "Archivo", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--hot); color:#0b0b0f; }
  .band { background:var(--blue); color:#fff; overflow:hidden; height:clamp(120px, 22vw, 240px); position:relative;
    border-bottom:3px solid var(--line-2); }
  .band span { position:absolute; left:clamp(10px, 2vw, 26px); bottom:-.12em; font-weight:900; font-stretch:62%;
    font-size:clamp(100px, 21vw, 250px); line-height:.8; white-space:nowrap; text-transform:uppercase; }
  .card { width:100%; max-width:380px; margin:clamp(24px, 6vh, 64px) auto; padding:0 16px; }
  h1 { margin:0 0 4px; font-size:32px; font-weight:900; font-stretch:66%; line-height:1; text-transform:uppercase; }
  h1 b { color:var(--hot); }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:15px; }
  label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; margin-bottom:7px; }
  .field { position:relative; }
  .field svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:17px; height:17px;
    fill:none; stroke:var(--muted); stroke-width:2; pointer-events:none; }
  input[type=password] { width:100%; height:50px; padding:0 12px 0 40px; font:inherit; font-size:16px; color:var(--ink);
    caret-color:var(--hot); background:var(--surface); border:3px solid var(--line-2); border-radius:0; transition:border-color .12s, box-shadow .12s; }
  input[type=password]:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring); }
  button { width:100%; height:52px; margin-top:14px; font:inherit; font-size:15px; font-weight:800; letter-spacing:.04em;
    text-transform:uppercase; cursor:pointer; color:#0b0b0f; background:var(--hot); border:3px solid var(--line-2);
    border-radius:0; transition:background .12s, transform .08s; }
  button:hover { background:var(--hot-hover); }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .err { display:flex; align-items:center; gap:8px; margin:14px 0 0; padding:10px 12px; border:2px solid var(--fail);
    font-size:14px; font-weight:650; color:var(--fail); background:var(--fail-soft); }
  .err svg { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2; }
</style>
</head>
<body>
<div class="band" aria-hidden="true"><span>Sign in</span></div>
<form class="card" method="post" action="/login">
  <h1>Spotify Playlists<b>.</b></h1>
  <p class="sub">Enter the password to continue.</p>

  <label for="password">Password</label>
  <div class="field">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <input type="password" id="password" name="password" autofocus required autocomplete="current-password">
  </div>

  <button type="submit">Sign in</button>

  {% if error %}
  <p class="err" role="alert">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 9v5m0 3v.01" stroke-width="2.2"/></svg>
    {{ error }}
  </p>
  {% endif %}
  <input type="hidden" name="next" value="{{ next_url }}">
</form>
</body>
</html>
