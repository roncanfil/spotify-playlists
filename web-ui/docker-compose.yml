# Playlist Downloader.  `docker compose up -d`, or paste into Portainer,
# Dockge, CasaOS, Unraid, Synology. Pulls a public image — nothing to build,
# no .env needed. Setup guide: deploy/README.md
#
# Change the four EDIT lines if you want to; everything else works as-is.

name: playlist-downloader

services:
  downloader:
    image: ghcr.io/roncanfil/spotify-playlists-to-mp3:latest
    container_name: playlist-downloader
    restart: unless-stopped
    ports:
      # EDIT host port — left number only; the container is always on 8765.
      - "8765:8765"
    environment:
      # EDIT password — blank means no login. Set one if reachable off-LAN.
      APP_PASSWORD: ""

      # EDIT Spotify — blank hides the Playlists tab; CSV upload still works.
      # Client ID from developer.spotify.com/dashboard ("Web API" ticked).
      # No client secret needed: PKCE.
      SPOTIFY_CLIENT_ID: ""

      # Must be HTTPS unless it is a loopback address (`localhost` is refused).
      # So either keep 127.0.0.1 below and connect through an SSH tunnel, or
      # once you have a domain with TLS use https://music.example.com/callback.
      # Register the exact value in the Spotify dashboard. See deploy/README.md.
      SPOTIFY_REDIRECT_URI: "http://127.0.0.1:8765/callback"

      # Reinstall yt-dlp on each start, so restarting fixes most YouTube
      # breakage without a new image. 0 pins the bundled version.
      AUTO_UPDATE_YTDLP: "1"

      # Paths inside the container; they match the mounts below.
      MUSIC_DIR: /music
      YTDLP_UPGRADE_DIR: /data/ytdlp
      BGUTIL_POT_BASE_URL: http://bgutil-provider:4416
    volumes:
      # EDIT host path — your library. Each playlist becomes a folder holding
      # its tracks, its .csv and its .m3u.
      - ./music:/music
      # App data: the Spotify token and yt-dlp updates. Small; leave it be.
      - ./data:/data
    depends_on:
      - bgutil-provider

  # Answers YouTube's bot checks, which server IPs trip more than home ones.
  # Optional: delete this service, the depends_on, and BGUTIL_POT_BASE_URL.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    expose:
      - "4416"
